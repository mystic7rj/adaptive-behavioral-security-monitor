name: ABSM CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  pr-quality-gates:
    # PR checks enforce code quality, typing, tests, and security scanning before merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint check
        # Linting catches style and correctness issues early with fast feedback.
        run: ruff check .

      - name: Mypy strict type check
        # Strict typing validates contracts and prevents runtime surprises in security logic.
        run: mypy --strict .

      - name: Unit test suite
        # PR path excludes e2e directory to keep checks focused on fast unit-level feedback.
        run: pytest tests/ --ignore=tests/e2e

      - name: Bandit SAST scan
        # SAST scanning identifies common Python security antipatterns before deployment.
        run: bandit -r absm/

      - name: Safety dependency vulnerability scan
        # Dependency CVE scan reduces exposure to known vulnerable package versions.
        run: safety check --full-report

  main-release:
    # Main-branch workflow builds and validates deployable image, then publishes artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        # Building here ensures the exact commit that passed checks can produce a runtime artifact.
        run: docker build -f infra/Dockerfile -t ghcr.io/${{ github.repository }}/absm:${{ github.sha }} .

      - name: Run e2e synthetic scenarios
        # E2E replay validates high-risk threat patterns against integrated scoring paths.
        run: |
          python -c "from tests.e2e.insider_threat_scenario import run_scenario as r1; from tests.e2e.compromised_creds_scenario import run_scenario as r2; assert r1() and r2()"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        # Image publish makes the validated build available for downstream deployment workflows.
        run: docker push ghcr.io/${{ github.repository }}/absm:${{ github.sha }}
